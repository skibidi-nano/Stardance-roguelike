name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0, v2.1.3

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ncurses
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev[reference:4]

      - name: Build the project
        run: make

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: main # This assumes your executable is named 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
